name: Build CHRONOS (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check, test, and build the frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build NSIS installer
        working-directory: src-tauri
        run: cargo install tauri-cli --version "^2" && cargo tauri build --bundles nsis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
